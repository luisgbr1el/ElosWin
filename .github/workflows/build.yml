name: Release Elos

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restaurar dependências
      run: dotnet restore

    - name: Publicar executável (Self-Contained x64)
      run: >
        dotnet publish -c Release -r win-x64 --self-contained
        -p:Platform=x64
        -p:PlatformTarget=x64
        -p:WindowsPackageType=None
        -p:WindowsAppSDKSelfContained=true
        -p:PublishSingleFile=false
        -o ./publish

    - name: Compilar Instalador com Inno Setup
      uses: Kevin-De-Koninck/Build-InnoSetup@v2
      with:
        projectFilePath: 'installer.iss'

    - name: Compactar versão portátil (ZIP opcional)
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./Elos-Portable-win-x64.zip

    - name: Anexar Instalador e ZIP na Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name || 'latest' }}
        files: |
          Output/ElosSetup-x64.exe
          Elos-Portable-win-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}